# PENDING: copy to .github/workflows/update-stats.yml (the push token lacked GitHub "workflow" scope).
name: Update NBA Stats Daily
# Larry P6 + memo 20: the data pipeline NO LONGER runs in Actions. Member predictions (and the nonces that
# seal them) must persist privately and must never be committed to this public repo, so the pipeline runs on
# the Railway web service (PIPELINE_INTERVAL_MIN + PREDICTIONS_PRIVATE_DIR/PUBLIC_DATA_DIR on a volume).
# This workflow only runs the offline self-tests. scripts/update_data.py refuses to run in CI by design.

on:
  push:
    branches: [main, rebuild/lean-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python3 -m unittest discover -s tests -p "test_*.py"
      - run: npm ci && npm run test:server
